[pytest]
# Pytest configuration for FluxVPN Platform

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Do not print local variables: fixtures can carry credential-bearing URLs.
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config errors)
    --strict-config
    # Show warnings
    -W default
    # Coverage options (when using --cov)
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    # Disable cacheprovider for cleaner output
    -p no:cacheprovider

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated tests)
    integration: Integration tests (test multiple components)
    e2e: End-to-end tests (complete user workflows)
    slow: Slow running tests
    database: Tests that require database
    redis: Tests that require Redis
    external: Tests that call external APIs
    payment: Payment gateway integration tests
    celery: Celery background task tests
    smoke: Smoke tests for quick validation
    skip_ci: Skip in CI environment

# Warning filters
# Third-party suppressions: scoped to exact warning type + module path.
# DO NOT blanket-suppress — each entry has a documented reason.
filterwarnings =
    # starlette 0.35.1 issues PendingDeprecationWarning for python-multipart import.
    # Fixed in starlette >=0.37 but that requires FastAPI >=0.110 — out of scope.
    ignore::PendingDeprecationWarning:starlette
    # httpx 0.27.0 deprecates the 'app' shortcut; FastAPI 0.109.0's TestClient
    # still uses it internally. Fixed when FastAPI upgrades its TestClient transport.
    ignore::DeprecationWarning:httpx

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    if self\.debug
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if 0:
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @(abc\.)?abstractmethod
    # Type checking blocks
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov
