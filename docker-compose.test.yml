# Disposable backend tests only. No application env files, ports or host volumes.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: fluxvpn_test
      POSTGRES_PASSWORD: synthetic-test-only
      POSTGRES_DB: fluxvpn_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxvpn_test -d fluxvpn_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [test-only]

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--databases", "16"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [test-only]

  worker-tests:
    build:
      context: .
      dockerfile: worker_api/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://fluxvpn_test:synthetic-test-only@postgres-test:5432/fluxvpn_test
      TEST_REDIS_URL: redis://redis-test:6379/15
      ENVIRONMENT: test
      SUPER_ADMIN_PASSWORD: synthetic-test-admin-password
      TELEGRAM_BOT_TOKEN: test_token
      JWT_SECRET_KEY: test_secret_key_for_unit_tests
      INTERNAL_API_KEY: test_internal_api_key
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks: [test-only]

networks:
  test-only:
    internal: true
